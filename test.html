<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#060b18">
  <title>LieutenantHead · Modern İnceleme</title>

  <script src="https://unpkg.com/three@0.139.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/STLLoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/libs/meshopt_decoder.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #060b18;
      --panel: rgba(6, 11, 24, 0.75);
      --line: rgba(99, 224, 255, 0.7);
      --text: #dbf8ff;
      --accent: #63e0ff;
      --accent-strong: #00ffe1;
      --danger: #ff6b6b;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at top, #0c1831 0%, var(--bg) 45%, #02040a 100%);
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .panel { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); box-shadow: var(--shadow); }
    .info { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 12px 14px; font-size: clamp(12px, 2vw, 14px); max-width: min(92vw, 600px); line-height: 1.45; }
    .status-error { color: var(--danger); }
    .controls { bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(98vw, 980px); }
    button, select, input[type="file"] { border: 1px solid var(--line); background: linear-gradient(145deg, #0e2749, #0a1c35); color: var(--text); border-radius: 999px; padding: 9px 12px; font-size: clamp(12px, 2vw, 14px); font-weight: 600; }
    button { cursor: pointer; transition: 180ms ease; min-width: 115px; }
    button:hover { border-color: var(--accent-strong); transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .settings-btn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 40; width: 44px; height: 44px; min-width: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 19px; }
    .mobile-controls { position: fixed; top: max(62px, calc(env(safe-area-inset-top) + 62px)); right: max(12px, env(safe-area-inset-right)); z-index: 35; width: min(92vw, 330px); transform: translateX(120%); transition: transform 220ms ease; padding: 14px; }
    .mobile-controls.open { transform: translateX(0); }
    .mobile-controls h3 { margin: 0 0 12px; font-size: 14px; }
    .control-item { margin-bottom: 10px; }
    .control-item label { display: block; margin-bottom: 4px; font-size: 12px; color: #b4ecff; }
    .control-item input, .control-item select { width: 100%; border-radius: 8px; }
    .loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(3, 6, 15, 0.72); text-align: center; font-weight: 600; letter-spacing: 0.25px; }
    .loading-card { width: min(92vw, 380px); padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(4, 10, 25, 0.9); }
    .progress-track { margin-top: 10px; width: 100%; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #63e0ff, #00ffe1); transition: width 150ms ease; }
    .loading-meta { margin-top: 8px; font-size: 12px; opacity: 0.9; min-height: 18px; }
    .loading-actions { margin-top: 12px; display: flex; justify-content: center; gap: 8px; }
    .hotspot { position: fixed; z-index: 25; transform: translate(-50%, -50%); border: 1px solid var(--line); background: rgba(6, 11, 24, 0.65); color: var(--text); border-radius: 999px; padding: 4px 8px; font-size: 11px; pointer-events: auto; }
    .measure-label { position: fixed; z-index: 28; transform: translate(-50%, -120%); background: rgba(0,0,0,0.8); border: 1px solid var(--accent); border-radius: 8px; padding: 3px 6px; font-size: 11px; }
    @media (max-width: 640px) { .controls { padding: 8px; gap: 6px; } button { min-width: 100px; padding: 8px 9px; } }
  </style>
</head>
<body>
  <div class="panel info" id="info">
    <strong id="device">🖥️ Masaüstü</strong> · <span id="instructions">Sürükle: Döndür · Sağ tuş: Kaydır · Tekerlek/Pinch: Yakınlaş</span><br>
    <span id="status">Başlatılıyor...</span>
  </div>

  <button class="settings-btn" id="settingsBtn" aria-label="Ayarları aç">⚙️</button>

  <aside class="panel mobile-controls" id="mobileControls" aria-label="Ayarlar paneli">
    <h3>Gelişmiş Ayarlar</h3>
    <div class="control-item">
      <label for="rotationSpeed">Auto-rotate Hızı: <span id="rotationSpeedValue">1.0</span>x</label>
      <input type="range" id="rotationSpeed" min="0.1" max="2" step="0.1" value="1" />
    </div>
    <div class="control-item">
      <label for="shadowStrength">Gölge Yoğunluğu: <span id="shadowStrengthValue">0.6</span></label>
      <input type="range" id="shadowStrength" min="0" max="1" step="0.05" value="0.6" />
    </div>
    <div class="control-item">
      <label for="iblSelect">HDR/IBL Ortamı</label>
      <select id="iblSelect">
        <option value="none">Kapalı</option>
        <option value="venice">Venice Sunset</option>
        <option value="studio">Studio Small</option>
      </select>
    </div>
    <div class="control-item">
      <label for="sectionPlane">Kesit Düzlemi (Y)</label>
      <input type="range" id="sectionPlane" min="-2" max="2" step="0.01" value="2" />
    </div>
    <div class="control-item">
      <label for="variantColor">Varyant (Renk)</label>
      <select id="variantColor">
        <option value="#d9d9d9">Varsayılan</option>
        <option value="#a9d6ff">Buz Mavisi</option>
        <option value="#ffcf8a">Kum</option>
        <option value="#a8ffbf">Mint</option>
      </select>
    </div>
    <div class="control-item">
      <label for="speedAnim">Animasyon Hızı: <span id="animSpeedValue">1.0</span>x</label>
      <input type="range" id="speedAnim" min="0.2" max="2" step="0.1" value="1" />
    </div>
    <div id="deviceInfo" style="font-size:12px;color:#97d8ea"></div>
  </aside>

  <div class="panel controls">
    <button id="explodeBtn">PARÇALA</button>
    <button id="collectBtn">TOPLA</button>
    <button id="autoBtn">OTOMATİK TUR</button>
    <button id="frontBtn">ÖN</button>
    <button id="backBtn">ARKA</button>
    <button id="sideBtn">YAN</button>
    <button id="topBtn">ÜST</button>
    <button id="measureBtn">ÖLÇÜM AÇ</button>
    <button id="animBtn">ANİMASYON OYNAT</button>
    <button id="arBtn">AR İLE GÖRÜNTÜLE</button>
    <input type="file" id="fileInput" accept=".gltf,.glb,.obj,.stl" />
  </div>

  <div class="loading" id="loading">
    <div class="loading-card">
      <div id="loadingText">Model yükleniyor...</div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="loading-meta" id="loadingMeta"></div>
      <div class="loading-actions">
        <button id="retryBtn" style="display:none;min-width:auto;padding:6px 12px;">Tekrar Dene</button>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <div class="measure-label" id="measureLabel" style="display:none"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ui = {
        canvas: document.getElementById('canvas'), loading: document.getElementById('loading'), status: document.getElementById('status'),
        loadingText: document.getElementById('loadingText'), progressBar: document.getElementById('progressBar'),
        loadingMeta: document.getElementById('loadingMeta'), retryBtn: document.getElementById('retryBtn'),
        explodeBtn: document.getElementById('explodeBtn'), collectBtn: document.getElementById('collectBtn'), autoBtn: document.getElementById('autoBtn'),
        frontBtn: document.getElementById('frontBtn'), backBtn: document.getElementById('backBtn'), sideBtn: document.getElementById('sideBtn'), topBtn: document.getElementById('topBtn'),
        measureBtn: document.getElementById('measureBtn'), animBtn: document.getElementById('animBtn'), arBtn: document.getElementById('arBtn'), fileInput: document.getElementById('fileInput'),
        settingsBtn: document.getElementById('settingsBtn'), mobileControls: document.getElementById('mobileControls'), device: document.getElementById('device'), instructions: document.getElementById('instructions'),
        deviceInfo: document.getElementById('deviceInfo'), rotationSpeedSlider: document.getElementById('rotationSpeed'), rotationSpeedValue: document.getElementById('rotationSpeedValue'),
        shadowStrength: document.getElementById('shadowStrength'), shadowStrengthValue: document.getElementById('shadowStrengthValue'), iblSelect: document.getElementById('iblSelect'),
        sectionPlane: document.getElementById('sectionPlane'), variantColor: document.getElementById('variantColor'), speedAnim: document.getElementById('speedAnim'), animSpeedValue: document.getElementById('animSpeedValue'),
        measureLabel: document.getElementById('measureLabel')
      };

      const state = { model: null, pieces: [], originalData: [], isExploded: false, autoTour: true, hoverPiece: null, reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
        hotspots: [], measurementMode: false, measurePoints: [], measureLine: null, mixer: null, actions: [], animationsEnabled: true, fileObjectUrl: null,
        lastLoadRequest: { url: './lieutenantHead.gltf', ext: 'gltf' }, loadTimeoutId: null };

      const isTouch = navigator.maxTouchPoints > 0;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile || isTouch) { ui.device.textContent = '📱 Dokunmatik Cihaz'; ui.instructions.textContent = 'Sürükle: Döndür · İki parmak: Kaydır/Yakınlaş'; }
      ui.deviceInfo.innerHTML = `<strong>Ekran:</strong> ${window.innerWidth}×${window.innerHeight}<br><strong>DPR:</strong> ${window.devicePixelRatio.toFixed(2)}<br><strong>Touch:</strong> ${isTouch ? 'Var ✓' : 'Yok ✗'}`;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060b18);
      scene.fog = new THREE.Fog(0x060b18, 12, 32);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(0, 0.8, 8);

      const renderer = new THREE.WebGLRenderer({ canvas: ui.canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.localClippingEnabled = true;

      const sectionPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2);
      renderer.clippingPlanes = [sectionPlane];

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 1.5;
      controls.maxDistance = 26;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.6 }));
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -2.2;
      ground.receiveShadow = true;
      scene.add(ground);

      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x1a233b, 0.45);
      scene.add(ambientLight);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(6, 8, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(1024, 1024);
      scene.add(keyLight);
      const fill = new THREE.DirectionalLight(0x7cd9ff, 0.42);
      fill.position.set(-5, 4, -6);
      scene.add(fill);

      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const rgbeLoader = new THREE.RGBELoader();

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function updateStatus(text, isError = false) { ui.status.textContent = text; ui.status.classList.toggle('status-error', isError); }


      function beginLoading(message = 'Model yükleniyor...') {
        window.clearTimeout(state.loadTimeoutId);
        ui.loading.style.display = 'grid';
        ui.loadingText.textContent = message;
        ui.loadingMeta.textContent = '';
        ui.progressBar.style.width = '0%';
        ui.retryBtn.style.display = 'none';
      }

      function endLoading() {
        window.clearTimeout(state.loadTimeoutId);
        ui.loading.style.display = 'none';
      }

      function failLoading(primaryMessage, detailMessage) {
        window.clearTimeout(state.loadTimeoutId);
        ui.loadingText.textContent = primaryMessage;
        ui.loadingMeta.textContent = detailMessage;
        ui.retryBtn.style.display = 'inline-block';
        updateStatus(primaryMessage, true);
      }

      function cleanupModel() {
        state.pieces = []; state.originalData = []; state.hotspots.forEach((h) => h.remove()); state.hotspots = [];
        if (state.model) scene.remove(state.model);
        if (state.measureLine) { scene.remove(state.measureLine); state.measureLine.geometry.dispose(); state.measureLine.material.dispose(); state.measureLine = null; }
        ui.measureLabel.style.display = 'none'; state.measurePoints = [];
      }

      function toPBR(material) {
        if (material?.isMeshStandardMaterial || material?.isMeshPhysicalMaterial) return material;
        const pbr = new THREE.MeshStandardMaterial({ color: material?.color || new THREE.Color(0xd9d9d9), map: material?.map || null, metalness: 0.15, roughness: 0.55 });
        return pbr;
      }

      function createHotspots(bounds) {
        const points = [
          { name: 'Ön Bölge', p: new THREE.Vector3(0, bounds.max.y * 0.5, bounds.max.z) },
          { name: 'Tepe', p: new THREE.Vector3(0, bounds.max.y, 0) },
          { name: 'Yan Bölge', p: new THREE.Vector3(bounds.max.x, 0, 0) }
        ];
        points.forEach((item) => {
          const el = document.createElement('button');
          el.className = 'hotspot';
          el.textContent = item.name;
          el.addEventListener('click', () => alert(`${item.name}: Bu alana özel bilgi balonu / teknik açıklama eklenebilir.`));
          document.body.appendChild(el);
          state.hotspots.push(el);
          item.element = el;
          item.position = item.p;
        });
        state.hotspotData = points;
      }

      function cleanupModel() {
        state.pieces = []; state.originalData = []; state.hotspots.forEach((h) => h.remove()); state.hotspots = [];
        if (state.model) scene.remove(state.model);
        if (state.measureLine) { scene.remove(state.measureLine); state.measureLine.geometry.dispose(); state.measureLine.material.dispose(); state.measureLine = null; }
        ui.measureLabel.style.display = 'none'; state.measurePoints = [];
      }

      function toPBR(material) {
        if (material?.isMeshStandardMaterial || material?.isMeshPhysicalMaterial) return material;
        const pbr = new THREE.MeshStandardMaterial({ color: material?.color || new THREE.Color(0xd9d9d9), map: material?.map || null, metalness: 0.15, roughness: 0.55 });
        return pbr;
      }

      function createHotspots(bounds) {
        const points = [
          { name: 'Ön Bölge', p: new THREE.Vector3(0, bounds.max.y * 0.5, bounds.max.z) },
          { name: 'Tepe', p: new THREE.Vector3(0, bounds.max.y, 0) },
          { name: 'Yan Bölge', p: new THREE.Vector3(bounds.max.x, 0, 0) }
        ];
        points.forEach((item) => {
          const el = document.createElement('button');
          el.className = 'hotspot';
          el.textContent = item.name;
          el.addEventListener('click', () => alert(`${item.name}: Bu alana özel bilgi balonu / teknik açıklama eklenebilir.`));
          document.body.appendChild(el);
          state.hotspots.push(el);
          item.element = el;
          item.position = item.p;
        });
        state.hotspotData = points;
      }


      function setupModel(root, animations = []) {
        cleanupModel();
        state.model = root;
        scene.add(root);

        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;

        root.position.sub(center);
        root.scale.setScalar(5 / maxDim);

        root.traverse((child) => {
          if (!child.isMesh) return;
          child.material = toPBR(Array.isArray(child.material) ? child.material[0] : child.material);
          child.material.envMapIntensity = 1.05;
          child.castShadow = true;
          child.receiveShadow = true;
          state.pieces.push(child);
          const emissive = child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0x000000);
          child.userData.originalEmissive = emissive;
          child.userData.originalIntensity = child.material.emissiveIntensity ?? 0;
          child.userData.baseColor = child.material.color.clone();
          state.originalData.push({ position: child.position.clone(), rotation: child.rotation.clone(), emissiveIntensity: child.material.emissiveIntensity ?? 0 });
        });

        if (state.mixer) state.mixer.stopAllAction();
        state.mixer = new THREE.AnimationMixer(root);
        state.actions = animations.map((clip) => state.mixer.clipAction(clip));
        ui.animBtn.disabled = state.actions.length === 0;

        const scaledBounds = new THREE.Box3().setFromObject(root);
        createHotspots(scaledBounds);
        updateStatus(`${state.pieces.length} parça hazır · Format desteği: GLTF/GLB/OBJ/STL`);
        endLoading();
      }

      function handleGLTF(gltf) { setupModel(gltf.scene, gltf.animations || []); }

      function loadHdrEnvironment(type) {
        if (type === 'none') { scene.environment = null; return; }
        const map = {
          venice: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/equirectangular/venice_sunset_1k.hdr',
          studio: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/equirectangular/royal_esplanade_1k.hdr'
        };
        rgbeLoader.load(map[type], (texture) => {
          const envMap = pmrem.fromEquirectangular(texture).texture;
          scene.environment = envMap;
          texture.dispose();
        }, undefined, () => updateStatus('HDR yüklenemedi, varsayılan ışık kullanılıyor.', true));
      }

      function loadModelFromUrl(url, ext) {
        state.lastLoadRequest = { url, ext };
        beginLoading('Model yükleniyor...');
        let resourceErrors = 0;

        const manager = new THREE.LoadingManager();
        manager.onError = (resourceUrl) => {
          resourceErrors += 1;
          ui.loadingMeta.textContent = `Eksik/erişilemeyen kaynak tespit edildi: ${resourceUrl}`;
        };

        manager.onLoad = () => {
          if (resourceErrors > 0) {
            updateStatus(`Model yüklendi (${resourceErrors} eksik yardımcı kaynak olabilir).`, true);
          }
        };

        manager.onProgress = (_, loaded, total) => {
          const p = total ? Math.round((loaded / total) * 100) : 0;
          ui.progressBar.style.width = `${p}%`;
          ui.loadingText.textContent = `Yükleniyor... %${p}`;
        };

        state.loadTimeoutId = window.setTimeout(() => {
          failLoading('Yükleme zaman aşımına uğradı.', 'Ağ yavaş olabilir veya model dosyası erişilemiyor. "Tekrar Dene" ile yeniden deneyin.');
        }, 20000);

        const onModelLoaded = (result) => {
          window.clearTimeout(state.loadTimeoutId);
          handleGLTF(result);
        };

        const onModelError = (error, formatLabel) => {
          console.error(`${formatLabel} yükleme hatası:`, error);
          const detail = error?.message || 'Bilinmeyen hata';
          failLoading(`${formatLabel} modeli yüklenemedi.`, `Detay: ${detail}`);
        };

        if (ext === 'gltf' || ext === 'glb') {
          const draco = new THREE.DRACOLoader(manager);
          draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
          const loader = new THREE.GLTFLoader(manager);
          loader.setDRACOLoader(draco);
          if (window.MeshoptDecoder) loader.setMeshoptDecoder(MeshoptDecoder);
          loader.load(url, onModelLoaded, undefined, (error) => onModelError(error, 'GLTF/GLB'));
          return;
        }
        if (ext === 'obj') {
          const loader = new THREE.OBJLoader(manager);
          loader.load(url, (obj) => { window.clearTimeout(state.loadTimeoutId); setupModel(obj, []); }, undefined, (error) => onModelError(error, 'OBJ'));
          return;
        }
        if (ext === 'stl') {
          const loader = new THREE.STLLoader(manager);
          loader.load(url, (geometry) => {
            window.clearTimeout(state.loadTimeoutId);
            const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xd9d9d9, metalness: 0.1, roughness: 0.65 }));
            const group = new THREE.Group(); group.add(mesh); setupModel(group, []);
          }, undefined, (error) => onModelError(error, 'STL'));
          return;
        }

        failLoading('Desteklenmeyen dosya formatı.', `Algılanan uzantı: ${ext || 'yok'}. Desteklenen: .gltf, .glb, .obj, .stl`);
      }

      function explode() {
        if (state.isExploded || state.pieces.length === 0) return;
        state.isExploded = true;
        updateStatus('Parçalar ayrılıyor...');
        state.pieces.forEach((piece, i) => {
          const delay = state.reducedMotion ? 0 : i * 0.045;
          const dist = 0.9 + Math.random() * 0.8;
          const angle = (i / state.pieces.length) * Math.PI * 2 + Math.random() * 0.5;
          gsap.to(piece.position, { x: Math.cos(angle) * dist, y: state.originalData[i].position.y + (Math.random() - 0.5) * 0.75, z: Math.sin(angle) * dist, duration: state.reducedMotion ? 0.01 : 1.4, delay, ease: 'power2.out' });
          gsap.to(piece.rotation, { x: state.originalData[i].rotation.x + (Math.random() - 0.5) * 0.7, y: state.originalData[i].rotation.y + (Math.random() - 0.5) * 1.1, z: state.originalData[i].rotation.z + (Math.random() - 0.5) * 0.7, duration: state.reducedMotion ? 0.01 : 1.4, delay, ease: 'power2.out' });
        });
      }
      function collect() {
        if (!state.isExploded || !state.pieces.length) return;
        state.isExploded = false; updateStatus('Parçalar toplanıyor...');
        state.pieces.forEach((piece, i) => {
          gsap.to(piece.position, { x: state.originalData[i].position.x, y: state.originalData[i].position.y, z: state.originalData[i].position.z, duration: state.reducedMotion ? 0.01 : 1.3, ease: 'power2.inOut' });
          gsap.to(piece.rotation, { x: state.originalData[i].rotation.x, y: state.originalData[i].rotation.y, z: state.originalData[i].rotation.z, duration: state.reducedMotion ? 0.01 : 1.3, ease: 'power2.inOut' });
        });
      }

      function gotoView(x, y, z) { gsap.to(camera.position, { x, y, z, duration: 0.8, onUpdate: () => controls.update() }); }

      function updateMeasurementLabel(worldPosition, distance) {
        const p = worldPosition.clone().project(camera);
        ui.measureLabel.style.display = 'block';
        ui.measureLabel.textContent = `${distance.toFixed(2)} birim`;
        ui.measureLabel.style.left = `${(p.x * 0.5 + 0.5) * window.innerWidth}px`;
        ui.measureLabel.style.top = `${(-p.y * 0.5 + 0.5) * window.innerHeight}px`;
      }

      function onPointerMove(event) {
        pointer.x = (event.clientX / innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / innerHeight) * 2 + 1;

        if (!state.measurementMode) {
          raycaster.setFromCamera(pointer, camera);
          const intersects = raycaster.intersectObjects(state.pieces, true);
          if (!intersects.length) {
            if (state.hoverPiece) {
              state.hoverPiece.material.emissive.copy(state.hoverPiece.userData.originalEmissive);
              state.hoverPiece.material.emissiveIntensity = state.hoverPiece.userData.originalIntensity;
              state.hoverPiece = null;
            }
            return;
          }
          const piece = intersects[0].object;
          if (state.hoverPiece === piece || !piece.material?.emissive) return;
          if (state.hoverPiece) {
            state.hoverPiece.material.emissive.copy(state.hoverPiece.userData.originalEmissive);
            state.hoverPiece.material.emissiveIntensity = state.hoverPiece.userData.originalIntensity;
          }
          piece.material.emissive.set(0x63e0ff);
          piece.material.emissiveIntensity = 2;
          state.hoverPiece = piece;
        }
      }

      function onCanvasClick(event) {
        if (!state.measurementMode) return;
        pointer.x = (event.clientX / innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(state.pieces, true)[0];
        if (!hit) return;
        state.measurePoints.push(hit.point.clone());
        if (state.measurePoints.length < 2) return;

        const [a, b] = state.measurePoints;
        const lineGeom = new THREE.BufferGeometry().setFromPoints([a, b]);
        if (state.measureLine) scene.remove(state.measureLine);
        state.measureLine = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0x00ffe1 }));
        scene.add(state.measureLine);

        const distance = a.distanceTo(b);
        const mid = a.clone().add(b).multiplyScalar(0.5);
        updateMeasurementLabel(mid, distance);
        state.measurePoints = [];
        updateStatus(`Ölçüm tamamlandı: ${distance.toFixed(2)} birim`);
      }

      ui.settingsBtn.addEventListener('click', () => ui.mobileControls.classList.toggle('open'));
      ui.canvas.addEventListener('pointerdown', () => ui.mobileControls.classList.remove('open'), { passive: true });
      ui.canvas.addEventListener('pointermove', onPointerMove);
      ui.canvas.addEventListener('click', onCanvasClick);

      ui.rotationSpeedSlider.addEventListener('input', (e) => { ui.rotationSpeedValue.textContent = Number(e.target.value).toFixed(1); });
      ui.shadowStrength.addEventListener('input', (e) => { const value = Number(e.target.value); ground.material.opacity = value; ui.shadowStrengthValue.textContent = value.toFixed(2); });
      ui.iblSelect.addEventListener('change', (e) => loadHdrEnvironment(e.target.value));
      ui.sectionPlane.addEventListener('input', (e) => { sectionPlane.constant = Number(e.target.value); });
      ui.variantColor.addEventListener('change', (e) => { const c = new THREE.Color(e.target.value); state.pieces.forEach((p) => p.material.color.copy(c)); updateStatus('Varyant rengi güncellendi.'); });
      ui.speedAnim.addEventListener('input', (e) => { const speed = Number(e.target.value); if (state.mixer) state.mixer.timeScale = speed; ui.animSpeedValue.textContent = speed.toFixed(1); });

      ui.explodeBtn.addEventListener('click', explode);
      ui.collectBtn.addEventListener('click', collect);
      ui.autoBtn.addEventListener('click', () => { state.autoTour = !state.autoTour; ui.autoBtn.textContent = state.autoTour ? 'OTOMATİK TUR' : 'TUR KAPALI'; });
      ui.frontBtn.addEventListener('click', () => gotoView(0, 0.8, 8));
      ui.backBtn.addEventListener('click', () => gotoView(0, 0.8, -8));
      ui.sideBtn.addEventListener('click', () => gotoView(8, 0.8, 0));
      ui.topBtn.addEventListener('click', () => gotoView(0, 9, 0.001));

      ui.measureBtn.addEventListener('click', () => {
        state.measurementMode = !state.measurementMode;
        ui.measureBtn.textContent = state.measurementMode ? 'ÖLÇÜM KAPAT' : 'ÖLÇÜM AÇ';
        updateStatus(state.measurementMode ? 'Ölçüm modu açık: Modelde iki nokta seçin.' : 'Ölçüm modu kapatıldı.');
      });

      ui.animBtn.addEventListener('click', () => {
        if (!state.actions.length) return;
        state.animationsEnabled = !state.animationsEnabled;
        if (state.animationsEnabled) state.actions.forEach((a) => { a.reset().play(); });
        else state.actions.forEach((a) => a.stop());
        ui.animBtn.textContent = state.animationsEnabled ? 'ANİMASYON DURDUR' : 'ANİMASYON OYNAT';
      });

      ui.arBtn.addEventListener('click', () => {
        const src = state.fileObjectUrl || `${location.origin}${location.pathname.replace('test.html', '')}lieutenantHead.gltf`;
        if (/Android/i.test(navigator.userAgent)) {
          location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(src)}&mode=ar_preferred#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;
          return;
        }
        updateStatus('AR için Android Scene Viewer veya WebXR destekli cihaz kullanın.');
      });

      ui.fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (state.fileObjectUrl) URL.revokeObjectURL(state.fileObjectUrl);
        state.fileObjectUrl = URL.createObjectURL(file);
        loadModelFromUrl(state.fileObjectUrl, ext);
      });

      ui.retryBtn.addEventListener('click', () => {
        const { url, ext } = state.lastLoadRequest;
        loadModelFromUrl(url, ext);
      });

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'f') {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
        }
      });

      const clock = new THREE.Clock();
      function animate() {
        controls.autoRotate = state.autoTour && !state.isExploded;
        controls.autoRotateSpeed = 0.5 * Number(ui.rotationSpeedSlider.value);
        controls.update();
        if (state.mixer) state.mixer.update(clock.getDelta());

        if (state.hotspotData) {
          state.hotspotData.forEach((h) => {
            const p = h.position.clone().project(camera);
            const visible = p.z < 1;
            h.element.style.display = visible ? 'block' : 'none';
            h.element.style.left = `${(p.x * 0.5 + 0.5) * window.innerWidth}px`;
            h.element.style.top = `${(-p.y * 0.5 + 0.5) * window.innerHeight}px`;
          });
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      loadModelFromUrl('./lieutenantHead.gltf', 'gltf');
      animate();
    });
  </script>
</body>
</html>
