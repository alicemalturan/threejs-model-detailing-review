<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#060b18">
  <title>LieutenantHead · Modern İnceleme</title>

  <script src="https://unpkg.com/three@0.139.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #060b18;
      --panel: rgba(6, 11, 24, 0.75);
      --line: rgba(99, 224, 255, 0.7);
      --text: #dbf8ff;
      --accent: #63e0ff;
      --accent-strong: #00ffe1;
      --danger: #ff6b6b;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at top, #0c1831 0%, var(--bg) 45%, #02040a 100%);
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .panel {
      position: fixed;
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .info {
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 12px 14px;
      font-size: clamp(12px, 2vw, 14px);
      max-width: min(92vw, 550px);
      line-height: 1.45;
    }

    .status-error { color: var(--danger); }

    .controls {
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: min(96vw, 620px);
    }

    button {
      border: 1px solid var(--line);
      background: linear-gradient(145deg, #0e2749, #0a1c35);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: clamp(12px, 2vw, 14px);
      font-weight: 600;
      cursor: pointer;
      transition: 180ms ease;
      min-width: 120px;
    }

    button:hover { border-color: var(--accent-strong); transform: translateY(-1px); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .settings-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 40;
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .mobile-controls {
      position: fixed;
      top: max(62px, calc(env(safe-area-inset-top) + 62px));
      right: max(12px, env(safe-area-inset-right));
      z-index: 35;
      width: min(92vw, 290px);
      transform: translateX(120%);
      transition: transform 220ms ease;
      padding: 14px;
    }

    .mobile-controls.open { transform: translateX(0); }
    .mobile-controls h3 { margin: 0 0 12px; font-size: 14px; }
    .control-item { margin-bottom: 10px; }
    .control-item label { display: block; margin-bottom: 4px; font-size: 12px; color: #b4ecff; }
    .control-item input { width: 100%; }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(3, 6, 15, 0.72);
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.25px;
    }

    @media (max-width: 640px) {
      .controls { padding: 8px; gap: 6px; }
      button { min-width: 104px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="panel info" id="info">
    <strong id="device">🖥️ Masaüstü</strong> · <span id="instructions">Sürükle: Döndür · Tekerlek/Pinch: Yakınlaş</span><br>
    <span id="status">Başlatılıyor...</span>
  </div>

  <button class="settings-btn" id="settingsBtn" aria-label="Ayarları aç">⚙️</button>

  <aside class="panel mobile-controls" id="mobileControls" aria-label="Ayarlar paneli">
    <h3>Kontrol Ayarları</h3>
    <div class="control-item">
      <label for="rotationSpeed">Döndürme Hızı: <span id="rotationSpeedValue">1.0</span>x</label>
      <input type="range" id="rotationSpeed" min="0.1" max="2" step="0.1" value="1" />
    </div>
    <div class="control-item">
      <label for="zoomSpeed">Yakınlaştırma Hızı: <span id="zoomSpeedValue">1.0</span>x</label>
      <input type="range" id="zoomSpeed" min="0.1" max="2" step="0.1" value="1" />
    </div>
    <div id="deviceInfo" style="font-size:12px;color:#97d8ea"></div>
  </aside>

  <div class="panel controls">
    <button id="explodeBtn">PARÇALA</button>
    <button id="collectBtn">TOPLA</button>
    <button id="autoBtn">OTOMATİK TUR</button>
  </div>

  <div class="loading" id="loading">Model yükleniyor...</div>
  <canvas id="canvas"></canvas>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.WebGLRenderingContext) {
        alert('WebGL desteklenmiyor. Lütfen güncel bir tarayıcı kullanın.');
        return;
      }

      const ui = {
        canvas: document.getElementById('canvas'),
        loading: document.getElementById('loading'),
        status: document.getElementById('status'),
        explodeBtn: document.getElementById('explodeBtn'),
        collectBtn: document.getElementById('collectBtn'),
        autoBtn: document.getElementById('autoBtn'),
        settingsBtn: document.getElementById('settingsBtn'),
        mobileControls: document.getElementById('mobileControls'),
        device: document.getElementById('device'),
        instructions: document.getElementById('instructions'),
        deviceInfo: document.getElementById('deviceInfo'),
        rotationSpeedSlider: document.getElementById('rotationSpeed'),
        zoomSpeedSlider: document.getElementById('zoomSpeed'),
        rotationSpeedValue: document.getElementById('rotationSpeedValue'),
        zoomSpeedValue: document.getElementById('zoomSpeedValue')
      };

      const state = {
        model: null,
        pieces: [],
        originalData: [],
        isExploded: false,
        autoTour: false,
        hoverPiece: null,
        touchStartDistance: 0,
        lastZoomLength: 10,
        reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
      };

      const isTouch = navigator.maxTouchPoints > 0;
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile || isTouch) {
        ui.device.textContent = '📱 Dokunmatik Cihaz';
        ui.instructions.textContent = 'Sürükle: Döndür · İki parmak: Yakınlaş/Uzaklaş';
      }

      ui.deviceInfo.innerHTML = `
        <strong>Ekran:</strong> ${window.innerWidth}×${window.innerHeight}<br>
        <strong>DPR:</strong> ${window.devicePixelRatio.toFixed(2)}<br>
        <strong>Touch:</strong> ${isTouch ? 'Var ✓' : 'Yok ✗'}
      `;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060b18);
      scene.fog = new THREE.Fog(0x060b18, 12, 30);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({ canvas: ui.canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 2;
      controls.maxDistance = 20;
      controls.enablePan = false;

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
      keyLight.position.set(5, 10, 8);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0x7cd9ff, 0.4);
      rimLight.position.set(-4, 2, -6);
      scene.add(rimLight);

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function updateStatus(text, isError = false) {
        ui.status.textContent = text;
        ui.status.classList.toggle('status-error', isError);
      }

      function setButtonsDuringAnimation(disabled) {
        ui.explodeBtn.disabled = disabled;
        ui.collectBtn.disabled = disabled;
      }

      function resetHoveredPiece() {
        if (!state.hoverPiece) return;
        state.hoverPiece.material.emissive.copy(state.hoverPiece.userData.originalEmissive);
        state.hoverPiece.material.emissiveIntensity = state.hoverPiece.userData.originalIntensity;
        state.hoverPiece = null;
      }

      function explode() {
        if (state.isExploded || state.pieces.length === 0) return;
        state.isExploded = true;
        setButtonsDuringAnimation(true);
        updateStatus('Parçalar ayrılıyor...');

        state.pieces.forEach((piece, i) => {
          const delay = state.reducedMotion ? 0 : i * 0.045;
          const dist = 0.9 + Math.random() * 0.8;
          const angle = (i / state.pieces.length) * Math.PI * 2 + Math.random() * 0.5;
          const height = (Math.random() - 0.5) * 0.75;

          gsap.to(piece.position, {
            x: Math.cos(angle) * dist,
            y: state.originalData[i].position.y + height,
            z: Math.sin(angle) * dist,
            duration: state.reducedMotion ? 0.01 : 1.8,
            delay,
            ease: 'power2.out'
          });

          gsap.to(piece.rotation, {
            x: state.originalData[i].rotation.x + (Math.random() - 0.5) * 0.7,
            y: state.originalData[i].rotation.y + (Math.random() - 0.5) * 1.1,
            z: state.originalData[i].rotation.z + (Math.random() - 0.5) * 0.7,
            duration: state.reducedMotion ? 0.01 : 1.8,
            delay,
            ease: 'power2.out'
          });

          gsap.to(piece.material, {
            emissiveIntensity: 2.1,
            duration: state.reducedMotion ? 0.01 : 0.55,
            yoyo: true,
            repeat: 1,
            delay
          });
        });

        window.setTimeout(() => {
          setButtonsDuringAnimation(false);
          updateStatus('Parçalar ayrıldı.');
        }, state.reducedMotion ? 50 : 2100);
      }

      function collect() {
        if (!state.isExploded || state.pieces.length === 0) return;
        state.isExploded = false;
        setButtonsDuringAnimation(true);
        updateStatus('Parçalar toplanıyor...');

        state.pieces.forEach((piece, i) => {
          const delay = state.reducedMotion ? 0 : i * 0.03;
          gsap.to(piece.position, {
            x: state.originalData[i].position.x,
            y: state.originalData[i].position.y,
            z: state.originalData[i].position.z,
            duration: state.reducedMotion ? 0.01 : 1.6,
            delay,
            ease: 'power2.inOut'
          });

          gsap.to(piece.rotation, {
            x: state.originalData[i].rotation.x,
            y: state.originalData[i].rotation.y,
            z: state.originalData[i].rotation.z,
            duration: state.reducedMotion ? 0.01 : 1.6,
            delay,
            ease: 'power2.inOut'
          });

          gsap.to(piece.material, {
            emissiveIntensity: state.originalData[i].emissiveIntensity,
            duration: state.reducedMotion ? 0.01 : 0.8,
            delay
          });
        });

        window.setTimeout(() => {
          setButtonsDuringAnimation(false);
          updateStatus('Parçalar toplandı.');
        }, state.reducedMotion ? 50 : 1800);
      }

      function setupModel(gltf) {
        state.model = gltf.scene;
        scene.add(state.model);

        const box = new THREE.Box3().setFromObject(state.model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;

        state.model.position.sub(center);
        state.model.scale.setScalar(5 / maxDim);

        state.model.traverse((child) => {
          if (!child.isMesh || !child.material) return;
          state.pieces.push(child);

          const emissive = child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0x000000);
          child.userData.originalEmissive = emissive;
          child.userData.originalIntensity = child.material.emissiveIntensity ?? 0;

          state.originalData.push({
            position: child.position.clone(),
            rotation: child.rotation.clone(),
            emissiveIntensity: child.material.emissiveIntensity ?? 0
          });
        });

        updateStatus(`${state.pieces.length} parça hazır.`);
        ui.loading.style.display = 'none';
      }

      function loadModel() {
        const manager = new THREE.LoadingManager();
        manager.onProgress = (_, loaded, total) => {
          updateStatus(`Yükleniyor: ${loaded}/${total}`);
        };

        const loader = new THREE.GLTFLoader(manager);
        loader.load(
          './lieutenantHead.gltf',
          setupModel,
          undefined,
          (error) => {
            console.error('Model yükleme hatası:', error);
            ui.loading.textContent = 'Model yüklenemedi';
            updateStatus('Model yükleme hatası.', true);
          }
        );
      }

      ui.settingsBtn.addEventListener('click', () => ui.mobileControls.classList.toggle('open'));
      ui.canvas.addEventListener('pointerdown', () => ui.mobileControls.classList.remove('open'), { passive: true });

      ui.rotationSpeedSlider.addEventListener('input', (event) => {
        const value = Number(event.target.value);
        ui.rotationSpeedValue.textContent = value.toFixed(1);
        controls.autoRotateSpeed = 0.5 * value;
      });

      ui.zoomSpeedSlider.addEventListener('input', (event) => {
        ui.zoomSpeedValue.textContent = Number(event.target.value).toFixed(1);
      });

      ui.canvas.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 2) return;
        const dx = event.touches[0].clientX - event.touches[1].clientX;
        const dy = event.touches[0].clientY - event.touches[1].clientY;
        state.touchStartDistance = Math.hypot(dx, dy);
        state.lastZoomLength = camera.position.length();
      }, { passive: true });

      ui.canvas.addEventListener('touchmove', (event) => {
        if (event.touches.length !== 2 || !state.touchStartDistance) return;
        const dx = event.touches[0].clientX - event.touches[1].clientX;
        const dy = event.touches[0].clientY - event.touches[1].clientY;
        const currentDistance = Math.hypot(dx, dy);
        const scale = state.touchStartDistance / currentDistance;
        const zoomSpeed = Number(ui.zoomSpeedSlider.value);
        const nextZoom = THREE.MathUtils.clamp(state.lastZoomLength * scale * zoomSpeed, controls.minDistance, controls.maxDistance);
        camera.position.multiplyScalar(nextZoom / camera.position.length());
      }, { passive: true });

      ui.canvas.addEventListener('touchend', () => { state.touchStartDistance = 0; }, { passive: true });

      ui.canvas.addEventListener('pointermove', (event) => {
        if (!state.pieces.length) return;
        pointer.x = (event.clientX / innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(state.pieces, true);

        if (!intersects.length) return resetHoveredPiece();

        const piece = intersects[0].object;
        if (state.hoverPiece === piece || !piece.material?.emissive) return;

        resetHoveredPiece();
        piece.material.emissive.set(0x63e0ff);
        piece.material.emissiveIntensity = 2.2;
        state.hoverPiece = piece;
      });

      ui.explodeBtn.addEventListener('click', explode);
      ui.collectBtn.addEventListener('click', collect);
      ui.autoBtn.addEventListener('click', () => {
        state.autoTour = !state.autoTour;
        ui.autoBtn.textContent = state.autoTour ? 'DURDUR' : 'OTOMATİK TUR';
      });

      let resizeFrame = null;
      window.addEventListener('resize', () => {
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        });
      });

      document.addEventListener('keydown', (event) => {
        if (!['f', 'F'].includes(event.key)) return;
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      });

      const clock = new THREE.Clock();
      function animate() {
        const delta = clock.getDelta();
        controls.autoRotate = state.autoTour && !state.isExploded;
        controls.autoRotateSpeed = 0.5 * Number(ui.rotationSpeedSlider.value);
        controls.update(delta);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      loadModel();
      animate();
    });
  </script>
</body>
</html>
